name: 'Build'
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install dependencies
        run: npm install

      - name: type check
        run: npm run type-check

      - name: run lint
        run: npm run lint

      - name: test
        run: npm run test

      - name: build
        run: npm run build
